[Match]
Distribution=|debian
Distribution=|ubuntu

[Content]
PrepareScripts=%D/mkosi/mkosi.images/build/mkosi.conf.d/debian-ubuntu/mkosi.prepare
Packages=
        clang-tidy
        coccinelle
        lcov
        liburing-dev
        mypy
        # tools/check-pointer-deref.py needs the tree-sitter python binding plus the
        # C grammar. The C grammar (python module 'tree_sitter_c') is not reliably
        # packaged across distros; when it is missing the meson 'tree-sitter' suite
        # is skipped at configure time.
        python3-tree-sitter
        shellcheck
